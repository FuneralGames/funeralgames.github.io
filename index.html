<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funeral Games, Whitby UK</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #f7f7f7;
      cursor: pointer;
    }

    #wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    #projects {
      display: flex;
      justify-content: center;
      gap: 2rem;
      width: min(100vw, calc(100vh * 1940 / 1500));
      margin: 0 auto;
      padding: 3rem 0;
      background: #f7f7f7;
      cursor: default;
      box-sizing: border-box;
    }

    #projects .project {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      opacity: 1;
      transition: opacity 0.2s;
    }

    #projects .project:hover {
      opacity: 0.6;
    }

    #projects .project img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      object-position: center center;
      display: block;
    }

    #projects .project p {
      margin: 0;
      font-size: 18px;
      text-align: center;
      line-height: 1.4;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="wrapper" aria-label="Tap to toggle music playback.">
    <img id="image" src="anim.gif" draggable="false" />
  </div>

  <section id="projects">
    <a href="https://gjhilton.github.io/Sharpie/" class="project" target="_blank" rel="noopener noreferrer">
      <img src="logos/sharpie.png" alt="Sharpie" />
      <p>game for learning to read Early Modern handwriting</p>
    </a>
    <a href="https://gjhilton.github.io/Summa/" class="project" target="_blank" rel="noopener noreferrer">
      <img src="logos/summa.png" alt="Summa" />
      <p>simple spreadsheet for Early Modern English currency</p>
    </a>
    <a href="https://github.com/gjhilton/Saxton" class="project" target="_blank" rel="noopener noreferrer">
      <img src="logos/saxton.png" alt="Saxton" />
      <p>import Illustrator vectors into QGIS</p>
    </a>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.58/build/Tone.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  <script>
    (() => {
      const wrapper = document.getElementById("wrapper");
      let isPlaying = false;
      let synths = [];

      const playMidi = async () => {
        try {
          const response = await fetch("./trumpet.mid");
          const arrayBuffer = await response.arrayBuffer();
          const midi = new Midi(arrayBuffer);

          Tone.Transport.stop();
          Tone.Transport.cancel();
          synths.forEach(s => s.dispose());
          synths = [];

          midi.tracks.forEach(track => {
            const synth = new Tone.PolySynth().toDestination();
            synths.push(synth);

            const notes = track.notes.map(note => ({
              time: note.time,
              note: note.name,
              duration: note.duration,
              velocity: note.velocity
            }));

            new Tone.Part((time, value) => {
              synth.triggerAttackRelease(value.note, value.duration, time, value.velocity);
            }, notes).start(0);
          });

          await Tone.start();
          Tone.Transport.start();
        } catch (err) {
          console.error("Error playing MIDI:", err);
        }
      };

      const stopMidi = () => {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        synths.forEach(s => s.dispose());
        synths = [];
      };

      wrapper.addEventListener('click', async () => {
        if (!isPlaying) {
          await playMidi();
        } else {
          stopMidi();
        }
        isPlaying = !isPlaying;
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Funeral Games, Whitby UK</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    #fallbackImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #pannableImage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      will-change: transform;
      display: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #tapPrompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 1em 2em;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font: 1.2em sans-serif;
      border-radius: 0.5em;
      cursor: pointer;
      display: none;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body.motion-ready #tapPrompt {
      display: block;
    }

    body.motion-enabled #tapPrompt {
      display: none;
    }

    body.motion-enabled #pannableImage {
      display: block;
    }

    body.motion-enabled #fallbackImage {
      display: none;
    }
  </style>
</head>
<body>
  <div id="wrapper" aria-label="Tilt and drag image. Tap to toggle MIDI playback.">
    <img id="fallbackImage" src="anim.gif" draggable="false" />
    <img id="pannableImage" src="anim.gif" draggable="false" />
    <div id="tapPrompt" role="button" aria-label="Tap to enable motion">Tap to enable motion</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.58/build/Tone.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  <script>
    (() => {
      const wrapper = document.getElementById("wrapper");
      const img = document.getElementById("pannableImage");
      const tapPrompt = document.getElementById("tapPrompt");

      let baseWidth = 0, baseHeight = 0;
      let maxOffsetX = 0, maxOffsetY = 0;
      let fx = 0, fy = 0;
      let offsetX = 0, offsetY = 0;
      let posX = 0, posY = 0;

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;

      // === Tilt and Drag Logic ===

      function updateTransform() {
        const targetX = (fx + offsetX) * maxOffsetX;
        const targetY = (fy + offsetY) * maxOffsetY;

        posX = lerp(posX, targetX, 0.08);
        posY = lerp(posY, targetY, 0.08);

        posX = clamp(posX, -maxOffsetX, maxOffsetX);
        posY = clamp(posY, -maxOffsetY, maxOffsetY);

        img.style.transform = `translate(calc(-50% + ${-posX}px), calc(-50% + ${-posY}px))`;

        requestAnimationFrame(updateTransform);
      }

      function setupImage() {
        const vw = wrapper.clientWidth;
        const vh = wrapper.clientHeight;
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;
        const scale = Math.max(vw / iw, vh / ih) * 1.5;
        baseWidth = iw * scale;
        baseHeight = ih * scale;
        img.style.width = `${baseWidth}px`;
        img.style.height = `${baseHeight}px`;
        maxOffsetX = (baseWidth - vw) / 2;
        maxOffsetY = (baseHeight - vh) / 2;
        updateTransform();
      }

      function handleOrientation(e) {
        const deg2rad = Math.PI / 180;
        const _x = (e.beta || 0) * deg2rad;
        const _y = (e.gamma || 0) * deg2rad;
        const _z = (e.alpha || 0) * deg2rad;
        const cX = Math.cos(_x / 2), sX = Math.sin(_x / 2);
        const cY = Math.cos(_y / 2), sY = Math.sin(_y / 2);
        const cZ = Math.cos(_z / 2), sZ = Math.sin(_z / 2);
        const w = cZ * cX * cY - sZ * sX * sY;
        const x = cZ * sX * cY + sZ * cX * sY;
        const y = cZ * cX * sY - sZ * sX * cY;
        const z = sZ * cX * cY + cZ * sX * sY;
        fx = 2 * (x * z - w * y);
        fy = 2 * (w * x + y * z);
      }

      let lastTouch = null;

      wrapper.addEventListener("touchstart", e => {
        if (e.touches.length === 1) {
          lastTouch = e.touches[0];
        }
      });

      wrapper.addEventListener("touchmove", e => {
        if (e.touches.length === 1 && lastTouch) {
          const dx = e.touches[0].clientX - lastTouch.clientX;
          const dy = e.touches[0].clientY - lastTouch.clientY;
          offsetX -= dx / wrapper.clientWidth * 2;
          offsetY -= dy / wrapper.clientHeight * 2;
          offsetX = clamp(offsetX, -2, 2);
          offsetY = clamp(offsetY, -2, 2);
          lastTouch = e.touches[0];
        }
      });

      wrapper.addEventListener("touchend", () => {
        lastTouch = null;
      });

      function enableMotion() {
        window.addEventListener("deviceorientation", handleOrientation, true);
        document.body.classList.add("motion-enabled");
      }

      function requestMotionPermission() {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          document.body.classList.add("motion-ready");
          tapPrompt.addEventListener("click", () => {
            DeviceOrientationEvent.requestPermission()
              .then(result => {
                if (result === "granted") enableMotion();
              })
              .catch(() => {});
          });
        } else {
          enableMotion();
        }
      }

      if (img.complete) {
        setupImage();
        requestMotionPermission();
      } else {
        img.onload = () => {
          setupImage();
          requestMotionPermission();
        };
      }

      // === MIDI Playback Logic ===

      let isPlaying = false;
      let part;
      let synths = [];

      const playMidi = async () => {
        try {
          const response = await fetch("./trumpet.mid");
          const arrayBuffer = await response.arrayBuffer();
          const midi = new Midi(arrayBuffer);

          Tone.Transport.stop();
          Tone.Transport.cancel();
          synths.forEach(s => s.dispose());
          synths = [];

          midi.tracks.forEach(track => {
            const synth = new Tone.PolySynth().toDestination();
            synths.push(synth);

            const notes = track.notes.map(note => ({
              time: note.time,
              note: note.name,
              duration: note.duration,
              velocity: note.velocity
            }));

            part = new Tone.Part((time, value) => {
              synth.triggerAttackRelease(value.note, value.duration, time, value.velocity);
            }, notes).start(0);
          });

          await Tone.start();
          Tone.Transport.start();
        } catch (err) {
          console.error("Error playing MIDI:", err);
        }
      };

      const stopMidi = () => {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        synths.forEach(s => s.dispose());
        synths = [];
      };

      wrapper.addEventListener('click', async () => {
        if (!isPlaying) {
          await playMidi();
        } else {
          stopMidi();
        }
        isPlaying = !isPlaying;
      });
    })();
  </script>
</body>
</html>

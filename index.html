<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funeral Games, Whitby UK</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f7f7;
      cursor: pointer;
    }

    #wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div id="wrapper" aria-label="Tap to toggle music playback.">
    <img id="image" src="anim.gif" draggable="false" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.58/build/Tone.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
  <script>
    (() => {
      const wrapper = document.getElementById("wrapper");
      let isPlaying = false;
      let synths = [];

      const playMidi = async () => {
        try {
          const response = await fetch("./trumpet.mid");
          const arrayBuffer = await response.arrayBuffer();
          const midi = new Midi(arrayBuffer);

          Tone.Transport.stop();
          Tone.Transport.cancel();
          synths.forEach(s => s.dispose());
          synths = [];

          midi.tracks.forEach(track => {
            const synth = new Tone.PolySynth().toDestination();
            synths.push(synth);

            const notes = track.notes.map(note => ({
              time: note.time,
              note: note.name,
              duration: note.duration,
              velocity: note.velocity
            }));

            new Tone.Part((time, value) => {
              synth.triggerAttackRelease(value.note, value.duration, time, value.velocity);
            }, notes).start(0);
          });

          await Tone.start();
          Tone.Transport.start();
        } catch (err) {
          console.error("Error playing MIDI:", err);
        }
      };

      const stopMidi = () => {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        synths.forEach(s => s.dispose());
        synths = [];
      };

      wrapper.addEventListener('click', async () => {
        if (!isPlaying) {
          await playMidi();
        } else {
          stopMidi();
        }
        isPlaying = !isPlaying;
      });
    })();
  </script>
</body>
</html>
